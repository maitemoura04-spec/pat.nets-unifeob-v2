<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIFEOB Move</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo-area">
            <h1>🛴</h1>
            <h2>UNIFEOB Move</h2>
            <p>Mobilidade Inteligente para o Campus Mantiqueira</p>
        </div>

        <div class="form-area">

            <input
            id="usuario"
            type="text"
            placeholder="RA ou E-mail">

            <input
            id="senha"
            type="password"
            placeholder="Senha">

            <button onclick="login()">
                Entrar
            </button>

        </div>

        <div class="footer-login">

            <p>
                Sistema de Compartilhamento de Patinetes
            </p>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
