<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pat.net UNIFEOB</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-screen">

    <div class="top-area">

        <div class="logo-circle">
            🛴
        </div>

        <h1>Pat.net UNIFEOB</h1>

        <p>
            Mobilidade Inteligente • Campus Mantiqueira
        </p>

    </div>

    <div class="login-card">

        <h2>Entrar</h2>

        <div class="selector">

            <button class="active">
                RA
            </button>

            <button>
                E-mail
            </button>

        </div>

        <label>Usuário</label>

        <input
        id="usuario"
        type="text"
        placeholder="RA ou E-mail">

        <label>Senha</label>

        <input
        id="senha"
        type="password"
        placeholder="Digite sua senha">

        <button
        class="login-btn"
        onclick="login()">

            Entrar

        </button>

        <div class="demo-box">

            <h3>Modo Demonstração</h3>

            <p>RA: 202510123</p>

            <p>Senha: 123456</p>

        </div>

    </div>

</div>

<script>

function login(){

    const usuario =
    document.getElementById("usuario").value;

    const senha =
    document.getElementById("senha").value;

    if(
        usuario === "202510123"
        &&
        senha === "123456"
    ){

        window.location.href =
        "home.html";

    }

    else{

        alert(
        "Usuário ou senha inválidos"
        );

    }

}

</script>

</body>
</html>
