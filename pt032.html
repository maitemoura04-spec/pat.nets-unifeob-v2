<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reserva PT-032</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<header>

<h1>🛴 PT-032 Reservado</h1>

<p>Reserva válida por 5 minutos</p>

</header>

<div class="card">

<h2>Patinete Reservado</h2>

<p>Bateria: 82%</p>

<p>Estação C</p>

</div>

<div class="card">

<h2>⏳ Tempo Restante</h2>

<h1 id="contador">05:00</h1>

</div>

<button onclick="location.href='viagem.html'">

📱 Escanear QR Code

</button>

<br><br>

<button onclick="location.href='home.html'">

Cancelar Reserva

</button>

<script>

let tempo = 300;

const contador =
document.getElementById("contador");

setInterval(() => {

let min =
Math.floor(tempo/60);

let seg =
tempo%60;

contador.innerText =
String(min).padStart(2,"0")
+
":"
+
String(seg).padStart(2,"0");

if(tempo>0){

tempo--;

}

},1000);

</script>

</body>

</html>
